<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown &#10230; Confluence</title>
<style>
  :root{
    --bg:#e7eaee;
    --header:#3b434b;
    --header-2:#333a41;
    --panel:#ffffff;
    --panel-2:#f6f7f9;
    --ink:#3d444c;
    --ink-soft:#6c7681;
    --muted:#9aa4af;
    --border:#dde1e6;
    --border-soft:#e9ecef;

    --blue:#43b3dd;   --blue-l:#5ec3e8;   --blue-d:#2f9cc6;
    --green:#1fbf9c;  --green-l:#2fceac;  --green-d:#17a386;  --green-dd:#138d74;
    --purple:#8b70c1;
    --red:#ec5a4d;    --red-d:#d8483c;
    --yellow:#edc04a;

    --link:#2f9cc6;
    --code-bg:#3b434b;
    --code-fg:#e8ebee;

    --font-ui:'Trebuchet MS','Segoe UI',Tahoma,Verdana,Geneva,sans-serif;
    --font-mono:'JetBrains Mono','SF Mono','Cascadia Code','Fira Code','Roboto Mono',Menlo,Consolas,monospace;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:var(--font-ui);
    color:var(--ink);
    background:var(--bg);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  .app{display:flex;flex-direction:column;height:100%;}

  /* ---------- header ---------- */
  header{
    flex:none;
    display:flex;align-items:center;justify-content:space-between;
    gap:1.5rem;flex-wrap:wrap;
    padding:.85rem 1.4rem;
    background:var(--header);
    border-bottom:3px solid var(--header-2);
    animation:rise .4s ease both;
  }
  .brand h1{
    margin:0;
    font-size:clamp(1.15rem,2.4vw,1.5rem);
    font-weight:700;
    color:#fff;
    letter-spacing:.01em;
    line-height:1.1;
  }
  .brand h1 .arrow{color:var(--green-l);padding:0 .15em;}
  .brand h1 .light{font-weight:400;color:#aeb6bf;}
  .brand p{
    margin:.25rem 0 0;
    font-size:.68rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:#8b95a0;
  }

  .actions{display:flex;align-items:center;gap:1rem;}
  .kbd-hint{
    font-size:.62rem;letter-spacing:.08em;
    color:#8b95a0;text-transform:uppercase;
    text-align:right;line-height:1.6;
  }
  .kbd-hint b{
    color:#cfd5db;font-weight:400;
    border:1px solid #555d65;border-radius:3px;
    padding:.05em .35em;background:var(--header-2);
  }
  .btn{
    font-family:var(--font-ui);
    font-size:.78rem;font-weight:700;
    letter-spacing:.03em;
    color:#fff;border:none;border-radius:4px;
    padding:.62rem 1.15rem;
    cursor:pointer;
    transition:background .12s ease,transform .04s ease;
  }
  .btn-primary{background:var(--green);}
  .btn-primary:hover{background:var(--green-l);}
  .btn-primary:active{background:var(--green-dd);transform:translateY(1px);}
  .btn:focus-visible{outline:2px solid #fff;outline-offset:2px;}

  /* ---------- main ---------- */
  main{
    flex:1;min-height:0;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    padding:14px;
    background:var(--bg);
    background-image:radial-gradient(rgba(0,0,0,.045) 1px,transparent 1px);
    background-size:22px 22px;
  }
  .panel{
    display:flex;flex-direction:column;
    min-width:0;min-height:0;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:6px;
    box-shadow:0 1px 3px rgba(0,0,0,.06);
    overflow:hidden;
    animation:rise .45s ease both;
  }
  .panel.source{animation-delay:.05s;}
  .panel.preview-pane{animation-delay:.12s;}
  .panel.source:focus-within{border-color:var(--blue);box-shadow:0 0 0 2px rgba(67,179,221,.25);}

  .panel-head{
    flex:none;
    display:flex;align-items:center;gap:.6rem;
    padding:.6rem .85rem;
    background:var(--panel-2);
    border-bottom:1px solid var(--border);
  }
  .badge{
    width:25px;height:25px;border-radius:4px;
    display:grid;place-items:center;
    color:#fff;font-weight:700;font-size:.72rem;
    flex:none;
  }
  .badge.b1{background:var(--blue);}
  .badge.b2{background:var(--green);}
  .panel-head .label{
    font-size:.76rem;letter-spacing:.13em;
    text-transform:uppercase;color:var(--ink-soft);
    font-weight:700;
  }
  .panel-head .tag{
    margin-left:auto;
    font-size:.62rem;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);
    background:var(--panel);
    border:1px solid var(--border);border-radius:99px;
    padding:.22em .7em;
  }

  /* editor */
  #input{
    flex:1;min-height:0;width:100%;
    resize:none;border:none;outline:none;
    background:var(--panel);
    padding:1.1rem 1.2rem;
    font-family:var(--font-mono);
    font-size:.88rem;line-height:1.7;
    color:var(--ink);
    tab-size:2;
  }
  #input::placeholder{color:var(--muted);}

  /* preview */
  #preview{
    flex:1;min-height:0;overflow:auto;
    padding:1.3rem 1.5rem 3rem;
    line-height:1.6;
    background:var(--panel);
  }
  #preview .ph{color:var(--muted);}

  #preview h1,#preview h2,#preview h3,
  #preview h4,#preview h5,#preview h6{
    font-weight:700;line-height:1.25;
    margin:1.5em 0 .5em;color:var(--ink);
  }
  #preview > :first-child{margin-top:0;}
  #preview h1{font-size:1.7rem;padding-bottom:.2em;border-bottom:2px solid var(--blue);}
  #preview h2{font-size:1.35rem;padding-bottom:.16em;border-bottom:1px solid var(--border);}
  #preview h3{font-size:1.15rem;}
  #preview h4{font-size:1rem;}
  #preview h5{font-size:.9rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);}
  #preview h6{font-size:.8rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);}
  #preview p{margin:.65em 0;}
  #preview a{color:var(--link);text-underline-offset:2px;}
  #preview strong{font-weight:700;}
  #preview ul,#preview ol{margin:.55em 0;padding-left:1.5em;}
  #preview li{margin:.22em 0;}
  #preview li::marker{color:var(--blue);}
  #preview blockquote{
    margin:1em 0;padding:.5em .9em;
    border-left:4px solid var(--blue);
    background:var(--panel-2);
    color:var(--ink-soft);
    border-radius:0 4px 4px 0;
  }
  #preview blockquote p{margin:.3em 0;}
  #preview hr{
    border:none;border-top:1px solid var(--border);
    margin:1.7em 0;
  }
  #preview code{
    font-family:var(--font-mono);font-size:.84em;
    background:rgba(67,179,221,.13);color:var(--blue-d);
    padding:.12em .38em;border-radius:3px;
  }
  #preview pre{
    background:var(--code-bg);color:var(--code-fg);
    padding:.95rem 1.05rem;border-radius:5px;
    overflow:auto;margin:1em 0;
  }
  #preview pre code{
    background:none;color:inherit;padding:0;
    font-size:.84rem;line-height:1.55;
  }
  #preview table{
    border-collapse:collapse;margin:1.05em 0;width:100%;
    font-size:.9rem;
  }
  #preview th,#preview td{
    border:1px solid var(--border);
    padding:.45em .7em;text-align:left;
  }
  #preview th{background:var(--panel-2);font-weight:700;}
  #preview tbody tr:nth-child(even){background:var(--panel-2);}

  /* ---------- status bar ---------- */
  footer{
    flex:none;
    display:flex;align-items:center;justify-content:space-between;
    gap:1rem;
    padding:.45rem 1.4rem;
    background:var(--panel);
    border-top:1px solid var(--border);
    font-size:.68rem;letter-spacing:.06em;
    text-transform:uppercase;color:var(--muted);
  }
  #status{color:var(--ink-soft);font-weight:700;transition:color .2s;}
  #status.ok{color:var(--green-d);}
  #status.err{color:var(--red-d);}

  /* ---------- toast (styled after the kit's alert bars) ---------- */
  .toast{
    position:fixed;left:50%;bottom:22px;
    transform:translate(-50%,160%);
    display:flex;align-items:center;gap:.7rem;
    min-width:290px;max-width:90vw;
    background:#fff;
    border:1px solid var(--border);
    border-left:5px solid var(--green);
    border-radius:5px;
    padding:.7rem .9rem;
    box-shadow:0 8px 24px rgba(0,0,0,.18);
    font-size:.82rem;
    z-index:50;opacity:0;
    transition:transform .35s cubic-bezier(.2,.85,.25,1),opacity .35s ease;
  }
  .toast.show{transform:translate(-50%,0);opacity:1;}
  .toast.err{border-left-color:var(--red);}
  .toast .ic{
    width:23px;height:23px;border-radius:50%;flex:none;
    background:var(--green);color:#fff;
    display:grid;place-items:center;
    font-size:.8rem;font-weight:700;line-height:1;
  }
  .toast.err .ic{background:var(--red);}
  .toast .msg b{
    display:block;font-size:.7rem;font-weight:700;
    text-transform:uppercase;letter-spacing:.05em;
    color:var(--green-d);margin-bottom:.1em;
  }
  .toast.err .msg b{color:var(--red-d);}
  .toast .msg span{color:var(--ink-soft);}

  @keyframes rise{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:none;}
  }

  /* scrollbars */
  #preview::-webkit-scrollbar,#input::-webkit-scrollbar,#preview pre::-webkit-scrollbar{width:11px;height:11px;}
  #preview::-webkit-scrollbar-thumb,#input::-webkit-scrollbar-thumb{
    background:var(--border);border:3px solid var(--panel);border-radius:99px;
  }
  #preview::-webkit-scrollbar-thumb:hover,#input::-webkit-scrollbar-thumb:hover{background:#c4cad1;}

  @media (max-width:840px){
    body{overflow:auto;}
    .app{height:auto;min-height:100%;}
    main{grid-template-columns:1fr;}
    #input,#preview{min-height:46vh;}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms!important;transition-duration:.01ms!important;}
  }
</style>

</div>

<script>
"use strict";

/* ============================================================
   Markdown -> HTML
   A compact block + inline parser. Output is semantic HTML
   that Confluence's editor maps onto its own elements on paste.
   ============================================================ */

function escapeHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function parseInline(text){
  const stash = [];
  const keep = function(html){ stash.push(html); return " S" + (stash.length - 1) + " "; };

  let s = text;

  // inline code — protect raw, escape its own contents
  s = s.replace(/`([^`]+)`/g, function(m,c){ return keep("<code>" + escapeHtml(c) + "</code>"); });

  // links [text](url "title")
  s = s.replace(/\[([^\]]*)\]\(([^)\s]+)(?:\s+"([^"]*)")?\)/g, function(m,t,u,ti){
    return keep('<a href="' + escapeHtml(u) + '" target="_blank" rel="noopener"' +
      (ti ? ' title="' + escapeHtml(ti) + '"' : "") + ">" + escapeHtml(t) + "</a>");
  });

  // escape everything else (placeholders survive — they contain no & < >)
  s = escapeHtml(s);

  // emphasis — bold before italic so ** / __ win
  s = s.replace(/\*\*([^*]+?)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/__([^_]+?)__/g, "<strong>$1</strong>");
  s = s.replace(/\*([^*]+?)\*/g, "<em>$1</em>");
  s = s.replace(/(^|[^a-zA-Z0-9])_([^_]+?)_(?![a-zA-Z0-9])/g, "$1<em>$2</em>");
  s = s.replace(/~~([^~]+?)~~/g, "<del>$1</del>");

  // restore protected spans
  s = s.replace(/ S(\d+) /g, function(m,i){ return stash[i]; });
  return s;
}

function buildList(rawLines){
  const items = [];
  for (let li = 0; li < rawLines.length; li++){
    const line = rawLines[li];
    const m = line.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
    if (m){
      items.push({
        indent: m[1].replace(/\t/g, "  ").length,
        ordered: /\d/.test(m[2]),
        text: m[3],
        extra: []
      });
    } else if (items.length){
      items[items.length - 1].extra.push(line.trim());
    }
  }
  if (!items.length) return "";

  let pos = 0;
  function build(minIndent){
    const tag = items[pos].ordered ? "ol" : "ul";
    let html = "<" + tag + ">";
    while (pos < items.length && items[pos].indent >= minIndent){
      const it = items[pos];
      const raw = it.text + (it.extra.length ? " " + it.extra.join(" ") : "");
      pos++;
      let children = "";
      if (pos < items.length && items[pos].indent > it.indent){
        children = build(items[pos].indent);
      }
      html += "<li>" + parseInline(raw) + children + "</li>";
    }
    return html + "</" + tag + ">";
  }
  return build(items[0].indent);
}

function parseMarkdown(src){
  const lines = src.replace(/\r\n?/g, "\n").split("\n");
  let html = "";
  let i = 0;

  while (i < lines.length){
    const line = lines[i];

    // blank
    if (/^\s*$/.test(line)){ i++; continue; }

    // fenced code block
    const fence = line.match(/^\s*```+\s*([\w-]*)\s*$/);
    if (fence){
      const lang = fence[1];
      const code = [];
      i++;
      while (i < lines.length && !/^\s*```+\s*$/.test(lines[i])){ code.push(lines[i]); i++; }
      i++; // closing fence
      html += "<pre><code" + (lang ? ' class="language-' + lang + '"' : "") + ">" +
              escapeHtml(code.join("\n")) + "</code></pre>";
      continue;
    }

    // heading
    const h = line.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/);
    if (h){
      const lvl = h[1].length;
      html += "<h" + lvl + ">" + parseInline(h[2]) + "</h" + lvl + ">";
      i++; continue;
    }

    // horizontal rule
    if (/^\s*([-*_])\s*(\1\s*){2,}$/.test(line)){
      html += "<hr>"; i++; continue;
    }

    // table — header row + separator row
    if (line.indexOf("|") !== -1 && i + 1 < lines.length &&
        /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)+\|?\s*$/.test(lines[i + 1])){
      const parseRow = function(r){
        return r.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map(function(c){ return c.trim(); });
      };
      const headers = parseRow(line);
      const aligns = parseRow(lines[i + 1]).map(function(spec){
        const l = spec.charAt(0) === ":", r = spec.charAt(spec.length - 1) === ":";
        return (l && r) ? "center" : r ? "right" : l ? "left" : "";
      });
      i += 2;
      const body = [];
      while (i < lines.length && lines[i].indexOf("|") !== -1 && !/^\s*$/.test(lines[i])){
        body.push(parseRow(lines[i])); i++;
      }
      const cell = function(tag, content, idx){
        return "<" + tag + (aligns[idx] ? ' style="text-align:' + aligns[idx] + '"' : "") + ">" +
               parseInline(content || "") + "</" + tag + ">";
      };
      let t = "<table><thead><tr>";
      headers.forEach(function(c, idx){ t += cell("th", c, idx); });
      t += "</tr></thead><tbody>";
      body.forEach(function(row){
        t += "<tr>";
        headers.forEach(function(_, idx){ t += cell("td", row[idx], idx); });
        t += "</tr>";
      });
      html += t + "</tbody></table>";
      continue;
    }

    // blockquote
    if (/^\s*>/.test(line)){
      const quote = [];
      while (i < lines.length && /^\s*>/.test(lines[i])){
        quote.push(lines[i].replace(/^\s*>\s?/, "")); i++;
      }
      html += "<blockquote>" + parseMarkdown(quote.join("\n")) + "</blockquote>";
      continue;
    }

    // list (bullet or ordered, with nesting via indentation)
    if (/^\s*([-*+]|\d+[.)])\s+/.test(line)){
      const listLines = [];
      while (i < lines.length && (
              /^\s*([-*+]|\d+[.)])\s+/.test(lines[i]) ||
              (/^\s+\S/.test(lines[i]) && listLines.length))){
        listLines.push(lines[i]); i++;
      }
      html += buildList(listLines);
      continue;
    }

    // paragraph — gather until a blank line or a new block starts
    const para = [];
    while (i < lines.length && !/^\s*$/.test(lines[i]) &&
           !/^\s*```+/.test(lines[i]) &&
           !/^#{1,6}\s+/.test(lines[i]) &&
           !/^\s*>/.test(lines[i]) &&
           !/^\s*([-*+]|\d+[.)])\s+/.test(lines[i]) &&
           !/^\s*([-*_])\s*(\2\s*){2,}$/.test(lines[i])){
      para.push(lines[i]); i++;
    }
    html += "<p>" + parseInline(para.join("\n")).replace(/\n/g, "<br>") + "</p>";
  }

  return html;
}

/* ============================================================
   Wiring
   ============================================================ */

const inputEl    = document.getElementById("input");
const previewEl  = document.getElementById("preview");
const countEl    = document.getElementById("count");
const statusEl   = document.getElementById("status");
const copyBtn    = document.getElementById("copyBtn");
const toast      = document.getElementById("toast");
const toastIcon  = document.getElementById("toastIcon");
const toastTitle = document.getElementById("toastTitle");
const toastMsg   = document.getElementById("toastMsg");

let lastHtml = "";
let toastTimer;

function setStatus(msg, kind){
  statusEl.textContent = msg;
  statusEl.className = kind || "";
}

function showToast(ok, title, msg){
  toast.className = "toast" + (ok ? "" : " err");
  toastIcon.innerHTML = ok ? "&#10003;" : "&#33;";
  toastTitle.textContent = title;
  toastMsg.textContent = msg;
  void toast.offsetWidth; // restart transition
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toast.classList.remove("show"); }, 2600);
}

function render(){
  const md = inputEl.value;
  lastHtml = parseMarkdown(md);
  previewEl.innerHTML = lastHtml || '<p class="ph">Your formatted preview appears here.</p>';
  const words = md.trim() ? md.trim().split(/\s+/).length : 0;
  countEl.textContent = words + (words === 1 ? " word" : " words") + " · " + md.length + " chars";
}

let renderTimer;
inputEl.addEventListener("input", function(){
  clearTimeout(renderTimer);
  renderTimer = setTimeout(render, 120);
});

// Tab inserts spaces; Ctrl/Cmd+Enter copies
inputEl.addEventListener("keydown", function(e){
  if (e.key === "Tab"){
    e.preventDefault();
    const s = inputEl.selectionStart, en = inputEl.selectionEnd;
    inputEl.value = inputEl.value.slice(0, s) + "  " + inputEl.value.slice(en);
    inputEl.selectionStart = inputEl.selectionEnd = s + 2;
    render();
  } else if ((e.metaKey || e.ctrlKey) && e.key === "Enter"){
    e.preventDefault();
    copyForConfluence();
  }
});

function fallbackCopy(html){
  // contenteditable + execCommand preserves rich text where the
  // async Clipboard API is unavailable (older browsers, some file:// cases)
  const holder = document.createElement("div");
  holder.contentEditable = "true";
  holder.innerHTML = html;
  holder.style.cssText = "position:fixed;left:-9999px;top:0;opacity:0;";
  document.body.appendChild(holder);
  const range = document.createRange();
  range.selectNodeContents(holder);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
  sel.removeAllRanges();
  document.body.removeChild(holder);
  return ok;
}

async function copyForConfluence(){
  render(); // make sure lastHtml is current
  if (!lastHtml){
    setStatus("nothing to copy", "err");
    showToast(false, "Nothing to copy", "Add some Markdown first.");
    return;
  }
  const plain = inputEl.value;
  try {
    if (navigator.clipboard && window.ClipboardItem){
      await navigator.clipboard.write([
        new ClipboardItem({
          "text/html":  new Blob([lastHtml], { type: "text/html" }),
          "text/plain": new Blob([plain],    { type: "text/plain" })
        })
      ]);
      setStatus("copied", "ok");
      showToast(true, "Success", "Copied — paste into Confluence.");
      return;
    }
  } catch (e){ /* fall through to execCommand */ }

  const ok = fallbackCopy(lastHtml);
  setStatus(ok ? "copied" : "copy failed", ok ? "ok" : "err");
  if (ok){
    showToast(true, "Success", "Copied — paste into Confluence.");
  } else {
    showToast(false, "Copy failed", "Select the preview and copy manually.");
  }
}

copyBtn.addEventListener("click", copyForConfluence);

render();
</script>
</body>
</html>
